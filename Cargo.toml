[package]
name = "cemcl"
version = "0.2.3"
authors = ["constant-e <fmn_tzx@outlook.com>"]
edition = "2024"
license = "Apache 2.0"

[dependencies]
chrono = "0.4.44"
clipboard = "0.5.0"
dashmap = "6.2.1"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.31"
reqwest = { version = "0.13.4", features = ["form", "json", "stream"] }
serde = "1.0.228"
serde_json = "1.0.150"
slint = "1.16.1"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.2", features = ["v4", "fast-rng", "macro-diagnostics"] }
webbrowser = "1.2.1"
zip = "8.6.0"

[build-dependencies]
slint-build = "1.16.1"
