[package]
name = "cemcl"
version = "0.2.3"
authors = ["constant-e <fmn_tzx@outlook.com>"]
edition = "2024"
license = "Apache 2.0"

[dependencies]
chrono = "0.4.44"
clipboard = "0.5.0"
dashmap = "6.1.0"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["form", "json", "stream"] }
serde = "1.0.228"
serde_json = "1.0.149"
slint = { version = "1.15.1", features = ["compat-1-2", "std", "accessibility", "backend-winit", "renderer-software"], default-features = false }
tokio = { version = "1.51.1", features = ["full"] }
uuid = { version = "1.23.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
webbrowser = "1.2.0"
zip = "8.5.1"

[build-dependencies]
slint-build = "1.15.1"
